
name: Deploy FastAPI AI Service to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Repository Files
        run: |
          ls -la
          test -d API
          test -d Models
          test -f requirements.txt

      - name: Upload Application Files to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT }}
          source: "API,Models,requirements.txt"
          target: "/home/${{ secrets.LIGHTSAIL_USER }}/parking_ai_service"
          overwrite: true

      - name: Install Dependencies and Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /home/${{ secrets.LIGHTSAIL_USER }}/parking_ai_service

            echo "Checking uploaded files..."
            ls -la
            test -d API
            test -d Models
            test -f requirements.txt

            echo "Creating virtual environment..."
            python3 -m venv .venv

            source .venv/bin/activate

            echo "Installing dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "Restarting FastAPI..."
            sudo systemctl restart parking-ai.service

            echo "Checking service..."
            sudo systemctl status parking-ai.service --no-pager

            echo "Deployment completed!"
