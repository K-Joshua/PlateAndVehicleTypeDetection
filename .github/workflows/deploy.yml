name: Deploy FastAPI AI Service to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Repository Files
        run: |
          echo "Checking repository..."
          ls -la
          ls -la API/App/
          ls -la API/App/Models/

          test -d API
          test -f requirements.txt
          test -d API/App/Models

      - name: Upload Application to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT }}
          source: "API,requirements.txt"
          target: "/home/${{ secrets.LIGHTSAIL_USER }}/parking_ai_service"
          overwrite: true

      - name: Install Dependencies and Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /home/${{ secrets.LIGHTSAIL_USER }}/parking_ai_service

            echo "Checking uploaded files..."
            ls -la
            ls -la API/App/Models/

            test -f requirements.txt
            test -d API/App/Models

            echo "Creating virtual environment..."
            python3 -m venv .venv

            source .venv/bin/activate

            echo "Installing dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "Restarting FastAPI service..."
            sudo systemctl restart parking-ai.service

            echo "Checking service status..."
            sudo systemctl status parking-ai.service --no-pager

            echo "Deployment completed successfully!"
